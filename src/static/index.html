<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中国象棋</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>中国象棋</h1>

        <div id="lobby" class="panel">
            <div class="form-group">
                <label>房间名：</label>
                <input type="text" id="roomName" placeholder="输入房间名">
            </div>
            <div class="form-group buttons">
                <button id="createBtn" onclick="createRoom()">创建房间</button>
                <button id="joinBtn" onclick="joinRoom()">加入房间</button>
            </div>
            <p class="hint">创建房间后将等待对手加入，加入房间需输入已存在的房间名</p>
        </div>

        <div id="game" class="panel" style="display:none;">
            <div id="info">
                <span id="roomInfo"></span>
                <span id="turnInfo"></span>
                <span id="statusInfo"></span>
            </div>
            <div class="audio-controls">
                <button id="musicBtn" class="audio-btn" onclick="toggleMusic()" title="背景音乐">🎵</button>
                <button id="sfxBtn" class="audio-btn active" onclick="toggleSfx()" title="音效">🔊</button>
            </div>
            <div class="game-container">
                <canvas id="board"></canvas>
                <div class="chat-panel">
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input">
                        <select id="quickChat" onchange="sendQuickChat()">
                            <option value="">快捷消息...</option>
                            <option value="1">能不能快一点儿呀，我等到花儿也谢了</option>
                            <option value="2">再考虑考虑，别走臭棋哦</option>
                            <option value="3">你的棋艺不错嘛！</option>
                            <option value="4">哎呀，大意了！</option>
                            <option value="5">这局我赢定了！</option>
                            <option value="6">服了服了，你太厉害了</option>
                            <option value="7">和棋怎么样？</option>
                            <option value="8">我要认真了！</option>
                            <option value="9">运气不好，下次再来</option>
                            <option value="10">交个朋友吧！</option>
                        </select>
                        <input type="text" id="chatInput" placeholder="自定义消息..." maxlength="200">
                        <button onclick="sendChat()">发送</button>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button id="takeBackBtn" onclick="requestTakeBack()">悔棋</button>
                <button id="drawBtn" onclick="requestDraw()">求和</button>
                <button id="resignBtn" onclick="resign()">认输</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/board.js"></script>
    <script src="js/pieces.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/game.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
